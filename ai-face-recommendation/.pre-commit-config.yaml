# Run once with: pre-commit install
#
# Ruff and mypy are pinned to the same versions as the dev extra in
# pyproject.toml. A hook that lints differently from CI is worse than no hook:
# it teaches people to ignore it.

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # Model weights and datasets do not belong in git.
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        files: ^app/
        additional_dependencies:
          - pydantic==2.10.4
          - pydantic-settings==2.7.0
          - types-redis==4.6.0.20241004

  - repo: local
    hooks:
      # The runtime must never grow a training dependency or a database
      # driver. Catching that at commit time is far cheaper than catching it
      # when the production image doubles in size.
      - id: no-training-deps-in-runtime
        name: no torch/timm/scikit-image/postgres in runtime deps
        entry: python scripts/check_runtime_deps.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
