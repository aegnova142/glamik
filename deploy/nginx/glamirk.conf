# nginx vhost for glamirk.com / www / admin.
#
# Installed on the VPS at /etc/nginx/sites-available/glamirk, symlinked from
# sites-enabled/glamirk. Versioned here for the same reason as
# ecosystem.config.cjs: the running configuration should be reviewable and
# travel with the code it fronts.
#
# This file is NOT deployed automatically. After changing it:
#
#   scp deploy/nginx/glamirk.conf root@<vps>:/etc/nginx/sites-available/glamirk
#   scp deploy/nginx/snippets/glamirk-proxy.conf root@<vps>:/etc/nginx/snippets/
#   ssh root@<vps> 'nginx -t && systemctl reload nginx'
#
# ---------------------------------------------------------------------------
# Request body sizes
# ---------------------------------------------------------------------------
# nginx defaults client_max_body_size to 1m, and nothing here used to set it.
# That silently capped every upload in the product at 1 MiB: the proxy
# answered an HTML "413 Request Entity Too Large" page before the request ever
# reached Express, so neither multer's limits nor the app's friendly error
# message were ever involved. A 14 MB product photo failed against a 20 MB
# advertised limit, and the admin saw raw nginx HTML.
#
# The ceilings below are deliberately per-endpoint rather than one permissive
# global value. Each one is set just above the limit the application itself
# already enforces for that route, so that:
#
#   * legitimate uploads reach the app, and
#   * oversized ones are refused by the app, in JSON, with the wording the
#     UI already knows how to display — not by nginx, in HTML.
#
# That second point is why each value sits ABOVE the app's limit instead of
# exactly on it. If nginx were set to exactly the app's maximum, a file one
# byte over would be killed at the proxy and we would be back to an HTML 413.
# The headroom also absorbs the multipart envelope (boundary plus
# Content-Disposition headers), which makes the request body slightly larger
# than the file it carries.
#
# Limits are a real bound, not a formality — the global default stays at 1m
# and only the three endpoints that actually accept a file are raised.

server {
    listen 80;
    listen [::]:80;

    server_name glamirk.com www.glamirk.com admin.glamirk.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name glamirk.com www.glamirk.com admin.glamirk.com;

    ssl_certificate /etc/letsencrypt/live/glamirk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glamirk.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Everything that is not a file upload. Stated explicitly rather than left
    # to nginx's implicit default so that raising a limit below is always a
    # visible, local decision instead of a drift from an unwritten baseline.
    client_max_body_size 1m;

    # Admin Media Library. The route accepts images AND video
    # (validateMediaFile with accept: 'image-or-video'), so the binding
    # application limit here is multer's 60 MB video ceiling
    # (MEDIA_MAX_VIDEO_MB), not the 20 MB image one. Images are still held to
    # 20 MB (MEDIA_MAX_IMAGE_MB) by validateMediaFile once the magic bytes
    # have identified the file — a 25 MB JPEG passes this proxy and is then
    # rejected by the app with "Maximum image size is 20 MB", which is the
    # intended behaviour.
    location = /api/admin/media/upload {
        client_max_body_size 64m;
        include snippets/glamirk-proxy.conf;
    }

    # Customer avatar: AVATAR_MAX_BYTES, 5 MB.
    location = /api/account/profile/avatar {
        client_max_body_size 8m;
        include snippets/glamirk-proxy.conf;
    }

    # Review photos and video: REVIEW_VIDEO_MAX_BYTES, 25 MB.
    location = /api/account/reviews/media {
        client_max_body_size 28m;
        include snippets/glamirk-proxy.conf;
    }

    location / {
        include snippets/glamirk-proxy.conf;
    }
}
