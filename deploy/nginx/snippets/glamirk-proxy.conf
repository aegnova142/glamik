# Shared proxy settings for the Glamirk app (pm2, 127.0.0.1:3000).
#
# Installed on the VPS at /etc/nginx/snippets/glamirk-proxy.conf.
#
# These live in a snippet rather than being written once in `location /`
# because nginx locations do not inherit directives from a sibling location.
# The moment a second `location` block exists — which is what the upload
# size overrides need — it must repeat proxy_pass and every header, or
# requests matching it lose the proxy entirely and fall through to nginx's
# own filesystem handler as a 404.

proxy_pass http://127.0.0.1:3000;

proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

proxy_read_timeout 60s;
