services:
  - type: web
    name: glamirk-beauty
    env: node
    plan: free
    region: singapore
    branch: main
    # npm workspaces: one root install links shared/ into the other three
    # workspaces; the root build script then builds storefront -> admin ->
    # backend in dependency order.
    buildCommand: npm ci && npm run build
    # Starts the already-built bundle. (The old start script rebuilt on every
    # boot, which wasted the whole free-tier startup budget.)
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        value: 285566126841-e4o0578pseacsvc5ambgavphfnl20gcj.apps.googleusercontent.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
